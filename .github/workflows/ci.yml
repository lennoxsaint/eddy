name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -e ".[dev,mcp]"
      - run: ruff check src tests scripts
      - run: mypy src/eddy
      - run: pytest -q --cov=eddy --cov-report=term-missing
      - run: python scripts/sync_skill_surfaces.py --check

